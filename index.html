<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panorama das Estatais dos Estados Brasileiros</title>
    <link href="https://fonts.cdnfonts.com/css/rawline" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>

        <h1>Panorama das Estatais dos Estados Brasileiros</h1>

        <img src="tt-logo-int.png" alt="Logo do Tesouro Transparente">

    </header>

    <main data-aba-visivel="mapa">

        <ul class="barra-controle">
            <li><button data-modo="mapa" class="ativo">Explore as Empresas por Estado</button></li>
            <li><button data-modo="consolidado">Visão consolidada</button></li>
        </ul>


        <div class="wrapper-visao-mapa">

            <h2>Escolha um estado no mapa!</h2>

            <div class="container-mapa">

                <svg class="mapa"></svg>

            </div>

            <div class="container-visao-estado">

                <h3 class="box-nome-estado"></h3>

                <p class="linha-quantidade">O estado possui <span data-info-box-estado="quantidade"></span> empresas, das quais <span data-info-box-estado="quantidade-dep"></span> são <span class="dependente">dependentes</span> e <span data-info-box-estado="quantidade-nao-dep"></span> são <span class="nao-dependente"> não-dependentes</span></p>

                <div class="box-setores">

                </div>

            </div>

        </div>

        <div class="wrapper-visao-consolidada">

            <h2>Total de empresas por <select name="seletor-modo-grafico-barra" id="">
                <option value="setor">Setor</option>
                <option value="uf">UF</option>
            </select></h2>

            <div class="container-grafico-barras">

                <svg class="grafico-barras"></svg>

            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="script.js"></script>

    
</body>
</html>
